name: Check application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pixelforge
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: pixelforge_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_PORT: 5432
      DB_PASSWORD: ci_only
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, bcmath
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction
      - run: php artisan key:generate
      - run: npm ci
      - run: npm run lint && npm run types && npm run build
      - run: vendor/bin/pint --test
      - run: php artisan test
      - run: npx playwright install --with-deps chromium
      - run: php artisan migrate --force
        env:
          DB_DATABASE: pixelforge_test
      - run: npm run test:browser
      - name: Build and exercise the Cloud Run container
        run: |
          docker build -t pixelforge:ci .
          docker run -d --name pixelforge-web --network host --env-file <(sed '/^#/d; /^$/d' .env | grep -vE '^(APP_ENV|APP_DEBUG|DB_|PORT)') -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_USERNAME=pixelforge -e DB_PASSWORD -e DB_DATABASE=pixelforge_test -e PORT=8090 pixelforge:ci
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:8090/up
          curl --fail http://127.0.0.1:8090/login | grep -q Pixelforge
